# ATACseq Pipeline Configuration File

# ============================= Basic Settings =============================
# root directory of project
root_dir: "."

# Directory containing raw FASTQ files
fastq_dir: rawdata

# Species: "hs" (human), "mm" (mouse), "chm13" (T2T-CHM13), "fly" (Drosophila), "cel" (C. elegans)
species: chm13

# Sample sheet CSV file (must contain columns: sample,group,control,target,fq1,fq2)
samplesheet: samplesheet.csv

# Output directory for all results
outdir: result

# Number of threads for parallel processing
threads: 12

# Memory limit for sambamba sort (e.g., "16G", "32G")
sort_mem_limit: 42G

# Maximum fragment length for paired-end alignment
# ATACseq: typically 2000 bp to capture nucleosome-free and mono/di/tri-nucleosome fragments
max_frag_length: 2000

# Skip preprocessing steps, this is for running non-standard pipelines
skip_preprocess: false

# Perform spike-in normalization alignment
run_spike: false

# Normalization method: "CPM" (counts per million), "Spike" (spike-in), or "SpikeFree"
norm_method: CPM

# Peak calling with MACS3
call_peak: true

# MACS3 parameters used for peak calling
# ATACseq specific: --shift -100 --extsize 200 accounts for Tn5 transposase 9-bp duplication
# Example: "--nomodel --shift -100 --extsize 200 -q 0.01"
macs_parameter: --nomodel --shift -100 --extsize 200 -q 0.01

# ============================= Index Paths =============================
# Root directory containing genome indices
# Modify this to match your system's index location
# check helper.sh setup_genome for details
index_rootdir: /mnt/d/index

# Expected directory structure under index_rootdir:
#   index_rootdir/
#   ├── hs/v49/              # Human GRCh38
#   │   ├── bowtie2/
#   │   ├── GRCh38.primary_assembly.genome.fa.gz
#   │   ├── GRCh38.primary_assembly.genome.fa.gz.fai
#   │   ├── genes.bed
#   │   └── genes_protein_coding.bed
#   ├── hs/chm13/            # Human T2T-CHM13
#   │   ├── bowtie2/
#   │   ├── chm13v2.0.fa.gz
#   │   └── ...
#   ├── mm/vM38/             # Mouse GRCm39
#   │   ├── bowtie2/
#   │   ├── GRCm39.primary_assembly.genome.fa.gz
#   │   └── ...
#   ├── fly/                 # Drosophila BDGP6.54
#   │   ├── bowtie2/
#   │   ├── Drosophila_melanogaster.BDGP6.54.dna.toplevel.fa.gz
#   │   └── ...
#   ├── cel/                 # C. elegans WBcel235
#   │   ├── bowtie2/
#   │   ├── Caenorhabditis_elegans.WBcel235.dna.toplevel.fa.gz
#   │   └── ...
#   └── Ecoli_novoprotein/   # Spike-in genome (not used for ATACseq)
#       └── bowtie2/

# ============================= Advanced Options =============================
# Custom BED regions for heatmap generation (one per line, will be added to defaults)
# path should be absolute path
# Format: bed_region: /path/to/file.bed
# You can specify multiple regions:
# bed_region: /path/to/enhancers.bed
# bed_region: /path/to/promoters.bed
# bed_region: /path/to/ATACseq_peaks.bed
