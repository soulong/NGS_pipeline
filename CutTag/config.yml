# CUT&Tag Pipeline Configuration File

# ============================= Basic Settings =============================
# root directory of project
root_dir: "/mnt/e/EED/2026-08-25_CutTag_cel"

# Directory containing raw FASTQ files
fastq_dir: 01.RawData

# Species: "hs" (human), "mm" (mouse), "chm13" (T2T-CHM13), "fly" (Drosophila), "cel" (C. elegans)
species: cel

# Sample sheet CSV file (must contain columns: sample,group,control,target,fq1,fq2)
samplesheet: samplesheet.csv

# Output directory for all results
outdir: result

# Number of threads for parallel processing
threads: 8

# Memory limit for sambamba sort (e.g., "16G", "32G")
sort_mem_limit: 16G

# Maximum fragment length for paired-end alignment
max_frag_length: 1000

# Skip preprocessing steps, this is for running non-standard pipelines
skip_preprocess: true

# Perform spike-in normalization alignment
run_spike: true

# Normalization method: "CPM" (counts per million), "Spike" (spike-in), or "SpikeFree"
norm_method: CPM

# Peak calling tools: comma-separated subset of "macs, seacr" (any combination).
# Empty/null -> skip peak calling. "macs" runs the "macs3" command.
peak_caller: macs, seacr

# MACS3 options only (e.g. --broad --nomodel). "-t/-c/-f BAMPE/-g/-n/--keep-dup all" are handled by script.
# Note: "-g <genome size>" is set from the pipeline's own species table (helper.sh setup_genome).
macs_parameter: -q 0.01 --broad --broad-cutoff 0.05

# SEACR_1.3.sh positional args: <numeric threshold> <norm|non> <relaxed|stringent>.
# When a control sample exists in the samplesheet, the control bedgraph replaces the threshold.
# The experimental bedgraph (from filtered BAM) and the output prefix are handled by script.
seacr_parameter: 0.05 non stringent

# ============================= Index Paths =============================
# Root directory containing genome indices
# Modify this to match your system's index location
# check helper.sh setup_genome for details
index_rootdir: /mnt/d/index

# Expected directory structure under index_rootdir:
#   index_rootdir/
#   ├── hs/v49/              # Human GRCh38
#   │   ├── bowtie2/
#   │   ├── GRCh38.primary_assembly.genome.fa.gz
#   │   ├── GRCh38.primary_assembly.genome.fa.gz.fai
#   │   ├── genes.bed
#   │   └── genes_protein_coding.bed
#   ├── hs/chm13/            # Human T2T-CHM13
#   │   ├── bowtie2/
#   │   ├── chm13v2.0.fa.gz
#   │   └── ...
#   ├── mm/vM38/             # Mouse GRCm39
#   │   ├── bowtie2/
#   │   ├── GRCm39.primary_assembly.genome.fa.gz
#   │   └── ...
#   ├── fly/                 # Drosophila BDGP6.54
#   │   ├── bowtie2/
#   │   ├── Drosophila_melanogaster.BDGP6.54.dna.toplevel.fa.gz
#   │   └── ...
#   ├── cel/                 # C. elegans WBcel235
#   │   ├── bowtie2/
#   │   ├── Caenorhabditis_elegans.WBcel235.dna.toplevel.fa.gz
#   │   └── ...
#   └── Ecoli_novoprotein/   # Spike-in genome
#       └── bowtie2/

# ============================= Advanced Options =============================
# Spike-free normalization scale factor file (required if norm_method: SpikeFree)
# Relative to root_dir (or absolute). Generated by spike_free_normalization.R
# spike_free_sf_file: result/03_bam/SpikeFree_SF.txt

# Heatmap resolution for computeMatrix (bp per bin).
# Larger values reduce memory and runtime for big BED files:
#   memory ~= n_regions * n_samples * (window_size / binsize) * 8 bytes
#   50 bp: 100k regions x 30 samples x 120 bins ~= 3 GB (safe default)
#   10 bp: 100k regions x 30 samples x 600 bins ~= 14 GB (can OOM)
heatmap_binsize: 50

# Maximum number of BED regions used for heatmap computation.
# Larger BED files (e.g. consensus peaks of many samples) are subsampled
# to this many regions (fixed seed, reproducible) to bound memory/runtime.
# heatmap_max_regions: 100000

# Number of top most-variable genomic bins used for PCA (default 100000).
# Larger values keep more genome-wide signal; smaller values focus on
# high-variance regions (faster). Set to 0 to use all bins.
pca_ntop: 200000

# Custom BED regions for heatmap generation (one per line, will be added to defaults)
# path should be absolute path
# Format: bed_region: /path/to/file.bed
# You can specify multiple regions:
# bed_region: /path/to/enhancers.bed
# bed_region: /path/to/promoters.bed
# bed_region: /path/to/custom_peaks.bed